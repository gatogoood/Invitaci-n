<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invitación Cute 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts"></div>

<div class="container" id="questionBox">
  <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" class="pet">
  <h1>¿Quieres salir conmigo? 🐱🐶</h1>

  <div class="buttons">
    <button id="yesBtn">Sí 💖</button>
    <button id="noBtn">No 😿</button>
  </div>

  <p id="message"></p>
</div>

<div class="container hidden" id="formBox">
  <img src="https://media.giphy.com/media/v6aOjy0Qo1fIA/giphy.gif" class="pet">

  <h1>Perfecto ✨</h1>

  <label>Escoge una fecha 📅</label>
  <input type="date">

  <label>Escoge una hora ⏰</label>
  <input type="time">

  <label>¿Qué plan quieres? 🍿</label>

  <div class="options">
    <label><input type="checkbox"> Ver película 🎬</label>
    <label><input type="checkbox"> Ver serie 📺</label>
    <label><input type="checkbox"> Ir al cine 🍿</label>
    <label><input type="checkbox"> Ir por helado 🍦</label>
    <label><input type="checkbox"> Cocinar juntos 🍜</label>
    <label><input type="checkbox"> Ir a comer 🍔</label>
    <label><input type="checkbox"> Pasear y ver tiendas 🛍️</label>
  </div>

  <button id="continueBtn">Continuar 💕</button>
</div>

<div class="container hidden" id="termsBox">
  <img src="https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif" class="pet">

  <h1>Términos y condiciones 🐾</h1>

  <ul>
    <li>Dar cariño infinito 💖</li>
    <li>Compartir memes ✨</li>
    <li>Mandar reels graciosos 😂</li>
    <li>Dar abrazos cuando sea necesario 🤗</li>
  </ul>

  <button id="acceptBtn">Acepto los términos y condiciones 💘</button>
</div>

<div class="container hidden" id="finalBox">
  <img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" class="pet">
  <h1>YA NO HAY VUELTA ATRÁS 😹💖</h1>
  <p>La cita ha sido oficialmente aceptada ✨</p>
</div>

<script src="script.js"></script>
</body>
</html>
